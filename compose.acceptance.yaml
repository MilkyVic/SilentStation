{
  "name": "silentstation-acceptance-${SS_SNAPSHOT_ID:?snapshot required}",
  "services": {
    "tls-init": {
      "build": {
        "context": ".",
        "dockerfile": "docker/acceptance/Dockerfile.tls",
        "args": {
          "PG_IMAGE": "${PG_IMAGE:-postgres:16-alpine}"
        }
      },
      "image": "silentstation-tls:${SS_SNAPSHOT_ID}",
      "volumes": [
        "ca:/ca",
        "ca-private:/private",
        "tls-db:/db",
        "tls-web:/web",
        "tls-smtp:/mailpit"
      ],
      "network_mode": "none",
      "restart": "no"
    },
    "db": {
      "image": "${PG_IMAGE:-postgres:16-alpine}",
      "environment": {
        "POSTGRES_USER": "ss_owner",
        "POSTGRES_DB": "ss_test_${SS_SNAPSHOT_ID}",
        "POSTGRES_PASSWORD_FILE": "/run/secrets/db_password"
      },
      "volumes": [
        "db-data:/var/lib/postgresql/data",
        "tls-db:/run/tls:ro",
        "./docker/acceptance/pg-init.sh:/docker-entrypoint-initdb.d/010-tls.sh:ro",
        "db-secret:/run/secrets:ro"
      ],
      "command": [
        "postgres",
        "-c",
        "ssl=on",
        "-c",
        "ssl_cert_file=/run/tls/server.crt",
        "-c",
        "ssl_key_file=/run/tls/server.key",
        "-c",
        "log_parameter_max_length=0",
        "-c",
        "log_parameter_max_length_on_error=0",
        "-c",
        "log_statement=none"
      ],
      "depends_on": {
        "tls-init": {
          "condition": "service_completed_successfully"
        },
        "secrets-init": {
          "condition": "service_completed_successfully"
        }
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U ss_owner -d \"$$POSTGRES_DB\""
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 20
      },
      "networks": {
        "isolated": {
          "aliases": [
            "db-invalid-host"
          ]
        }
      },
      "mem_limit": "1g",
      "cpus": 1.0,
      "restart": "unless-stopped"
    },
    "mailpit": {
      "image": "${MAILPIT_IMAGE:-axllent/mailpit:v1.30.6}",
      "user": "1000:1000",
      "environment": {
        "MP_SMTP_TLS_CERT": "/run/tls/server.crt",
        "MP_SMTP_TLS_KEY": "/run/tls/server.key",
        "MP_SMTP_REQUIRE_STARTTLS": "true",
        "MP_WEBROOT": "/__test/mail/",
        "MP_MAX_MESSAGES": "100",
        "MP_DISABLE_VERSION_CHECK": "true",
        "MP_DATABASE": "/tmp/mailpit.db",
        "MP_BLOCK_REMOTE_CSS_AND_FONTS": "true"
      },
      "volumes": [
        "tls-smtp:/run/tls:ro"
      ],
      "tmpfs": [
        "/tmp"
      ],
      "depends_on": {
        "tls-init": {
          "condition": "service_completed_successfully"
        }
      },
      "networks": {
        "isolated": {
          "aliases": [
            "mailpit-invalid-host"
          ]
        }
      },
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "128m",
      "restart": "unless-stopped"
    },
    "migrate": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.api",
        "target": "acceptance-tools",
        "args": {
          "NODE_IMAGE": "${NODE_IMAGE:-node:22.23.5-alpine}"
        }
      },
      "image": "silentstation-tools:${SS_SNAPSHOT_ID:?snapshot required}",
      "environment": {
        "NODE_ENV": "production",
        "DATABASE_URL_FILE": "/run/secrets/database_url",
        "AUTH_SESSION_SECRET_FILE": "/run/secrets/auth_secret",
        "DB_TLS_MODE": "verify-full",
        "DB_TLS_CA_FILE": "/run/ca/ca.crt",
        "APP_URL": "https://localhost:18443",
        "AUTH_API_CORS_ORIGIN": "https://web:8443",
        "AUTH_REGISTER_OTP_EXPOSE_DEV_CODE": "false",
        "AUTH_ADMIN_LOGIN_OTP_EXPOSE_DEV_CODE": "false",
        "SURVEY_REAL_COLLECTION_ENABLED": "false",
        "SURVEY_ALLOW_SERVER_DEMO": "true",
        "AUTH_SMTP_HOST": "mailpit",
        "AUTH_SMTP_PORT": "1025",
        "AUTH_SMTP_SECURE": "false",
        "AUTH_SMTP_CA_FILE": "/run/ca/ca.crt",
        "AUTH_EMAIL_FROM": "test@acceptance.invalid",
        "GEMINI_API_KEY": "",
        "CRON_SECRET_FILE": "/run/secrets/cron_secret",
        "SS_SNAPSHOT_ID": "${SS_SNAPSHOT_ID}",
        "ACCEPTANCE_CONFIRM": "${SS_SNAPSHOT_ID}",
        "MIGRATION_CONFIRM": "yes"
      },
      "volumes": [
        "ca:/run/ca:ro",
        "runtime-secrets:/run/secrets:ro"
      ],
      "networks": [
        "isolated"
      ],
      "mem_limit": "1g",
      "cpus": 1.0,
      "restart": "no",
      "command": [
        "node",
        "dist-server/server/migrate.js"
      ],
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        },
        "secrets-init": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "fixtures": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.api",
        "target": "acceptance-tools",
        "args": {
          "NODE_IMAGE": "${NODE_IMAGE:-node:22.23.5-alpine}"
        }
      },
      "image": "silentstation-tools:${SS_SNAPSHOT_ID:?snapshot required}",
      "environment": {
        "NODE_ENV": "production",
        "DATABASE_URL_FILE": "/run/secrets/database_url",
        "AUTH_SESSION_SECRET_FILE": "/run/secrets/auth_secret",
        "DB_TLS_MODE": "verify-full",
        "DB_TLS_CA_FILE": "/run/ca/ca.crt",
        "APP_URL": "https://localhost:18443",
        "AUTH_API_CORS_ORIGIN": "https://web:8443",
        "AUTH_REGISTER_OTP_EXPOSE_DEV_CODE": "false",
        "AUTH_ADMIN_LOGIN_OTP_EXPOSE_DEV_CODE": "false",
        "SURVEY_REAL_COLLECTION_ENABLED": "false",
        "SURVEY_ALLOW_SERVER_DEMO": "true",
        "AUTH_SMTP_HOST": "mailpit",
        "AUTH_SMTP_PORT": "1025",
        "AUTH_SMTP_SECURE": "false",
        "AUTH_SMTP_CA_FILE": "/run/ca/ca.crt",
        "AUTH_EMAIL_FROM": "test@acceptance.invalid",
        "GEMINI_API_KEY": "",
        "CRON_SECRET_FILE": "/run/secrets/cron_secret",
        "SS_SNAPSHOT_ID": "${SS_SNAPSHOT_ID}",
        "ACCEPTANCE_CONFIRM": "${SS_SNAPSHOT_ID}"
      },
      "volumes": [
        "ca:/run/ca:ro",
        "operator:/private-operator",
        "runtime-secrets:/run/secrets:ro"
      ],
      "networks": [
        "isolated"
      ],
      "mem_limit": "1g",
      "cpus": 1.0,
      "restart": "no",
      "command": [
        "node",
        "dist-server/server/test-fixtures/initialize.js"
      ],
      "user": "0:0",
      "depends_on": {
        "migrate": {
          "condition": "service_completed_successfully"
        },
        "secrets-init": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "api": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.api",
        "target": "runtime",
        "args": {
          "NODE_IMAGE": "${NODE_IMAGE:-node:22.23.5-alpine}"
        }
      },
      "image": "silentstation-api:${SS_SNAPSHOT_ID:?snapshot required}",
      "environment": {
        "NODE_ENV": "production",
        "DATABASE_URL_FILE": "/run/secrets/database_url",
        "AUTH_SESSION_SECRET_FILE": "/run/secrets/auth_secret",
        "DB_TLS_MODE": "verify-full",
        "DB_TLS_CA_FILE": "/run/ca/ca.crt",
        "APP_URL": "https://localhost:18443",
        "AUTH_API_CORS_ORIGIN": "https://web:8443",
        "AUTH_REGISTER_OTP_EXPOSE_DEV_CODE": "false",
        "AUTH_ADMIN_LOGIN_OTP_EXPOSE_DEV_CODE": "false",
        "SURVEY_REAL_COLLECTION_ENABLED": "false",
        "SURVEY_ALLOW_SERVER_DEMO": "true",
        "AUTH_SMTP_HOST": "mailpit",
        "AUTH_SMTP_PORT": "1025",
        "AUTH_SMTP_SECURE": "false",
        "AUTH_SMTP_CA_FILE": "/run/ca/ca.crt",
        "AUTH_EMAIL_FROM": "test@acceptance.invalid",
        "GEMINI_API_KEY": "",
        "CRON_SECRET_FILE": "/run/secrets/cron_secret"
      },
      "volumes": [
        "ca:/run/ca:ro",
        "runtime-secrets:/run/secrets:ro"
      ],
      "networks": [
        "isolated"
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "512m",
      "cpus": 1.0,
      "restart": "unless-stopped",
      "depends_on": {
        "fixtures": {
          "condition": "service_completed_successfully"
        },
        "mailpit": {
          "condition": "service_started"
        },
        "secrets-init": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "web": {
      "build": {
        "context": ".",
        "dockerfile": "docker/acceptance/Dockerfile.web",
        "args": {
          "NODE_IMAGE": "${NODE_IMAGE:-node:22.23.5-alpine}",
          "WEB_IMAGE": "${WEB_IMAGE:-nginx:1.28-alpine}"
        }
      },
      "image": "silentstation-web:${SS_SNAPSHOT_ID}",
      "ports": [
        "127.0.0.1:8443:8443"
      ],
      "volumes": [
        "tls-web:/run/tls:ro"
      ],
      "depends_on": {
        "api": {
          "condition": "service_healthy"
        }
      },
      "networks": [
        "isolated"
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "128m",
      "restart": "unless-stopped"
    },
    "maintenance": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.api",
        "target": "runtime",
        "args": {
          "NODE_IMAGE": "${NODE_IMAGE:-node:22.23.5-alpine}"
        }
      },
      "image": "silentstation-api:${SS_SNAPSHOT_ID:?snapshot required}",
      "environment": {
        "NODE_ENV": "production",
        "DATABASE_URL_FILE": "/run/secrets/database_url",
        "AUTH_SESSION_SECRET_FILE": "/run/secrets/auth_secret",
        "DB_TLS_MODE": "verify-full",
        "DB_TLS_CA_FILE": "/run/ca/ca.crt",
        "APP_URL": "https://localhost:18443",
        "AUTH_API_CORS_ORIGIN": "https://web:8443",
        "AUTH_REGISTER_OTP_EXPOSE_DEV_CODE": "false",
        "AUTH_ADMIN_LOGIN_OTP_EXPOSE_DEV_CODE": "false",
        "SURVEY_REAL_COLLECTION_ENABLED": "false",
        "SURVEY_ALLOW_SERVER_DEMO": "true",
        "AUTH_SMTP_HOST": "mailpit",
        "AUTH_SMTP_PORT": "1025",
        "AUTH_SMTP_SECURE": "false",
        "AUTH_SMTP_CA_FILE": "/run/ca/ca.crt",
        "AUTH_EMAIL_FROM": "test@acceptance.invalid",
        "GEMINI_API_KEY": "",
        "CRON_SECRET_FILE": "/run/secrets/cron_secret"
      },
      "volumes": [
        "ca:/run/ca:ro",
        "runtime-secrets:/run/secrets:ro"
      ],
      "networks": [
        "isolated"
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "512m",
      "cpus": 1.0,
      "restart": "unless-stopped",
      "command": [
        "node",
        "dist-server/server/maintenance-worker.js"
      ],
      "healthcheck": {
        "disable": true
      },
      "depends_on": {
        "api": {
          "condition": "service_healthy"
        },
        "secrets-init": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "core-tests": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.api",
        "target": "acceptance-tools",
        "args": {
          "NODE_IMAGE": "${NODE_IMAGE:-node:22.23.5-alpine}"
        }
      },
      "image": "silentstation-tools:${SS_SNAPSHOT_ID:?snapshot required}",
      "environment": {
        "NODE_ENV": "test",
        "DATABASE_URL_FILE": "/run/secrets/database_url",
        "AUTH_SESSION_SECRET_FILE": "/run/secrets/auth_secret",
        "DB_TLS_MODE": "verify-full",
        "DB_TLS_CA_FILE": "/run/ca/ca.crt",
        "APP_URL": "https://localhost:18443",
        "AUTH_API_CORS_ORIGIN": "https://web:8443",
        "AUTH_REGISTER_OTP_EXPOSE_DEV_CODE": "true",
        "AUTH_ADMIN_LOGIN_OTP_EXPOSE_DEV_CODE": "true",
        "SURVEY_REAL_COLLECTION_ENABLED": "false",
        "SURVEY_ALLOW_SERVER_DEMO": "true",
        "AUTH_SMTP_HOST": "",
        "AUTH_SMTP_PORT": "1025",
        "AUTH_SMTP_SECURE": "false",
        "AUTH_SMTP_CA_FILE": "/run/ca/ca.crt",
        "AUTH_EMAIL_FROM": "test@acceptance.invalid",
        "GEMINI_API_KEY": "",
        "CRON_SECRET_FILE": "",
        "SS_SNAPSHOT_ID": "${SS_SNAPSHOT_ID}",
        "ACCEPTANCE_CONFIRM": "${SS_SNAPSHOT_ID}",
        "AUTH_ADMIN_LOGIN_OTP_MAX_ATTEMPTS": "2"
      },
      "volumes": [
        "ca:/run/ca:ro",
        "runtime-secrets:/run/secrets:ro"
      ],
      "networks": [
        "isolated"
      ],
      "mem_limit": "1g",
      "cpus": 1.0,
      "restart": "no",
      "profiles": [
        "test"
      ],
      "command": [
        "node",
        "scripts/docker-integration.mjs"
      ],
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        },
        "secrets-init": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "e2e": {
      "build": {
        "context": ".",
        "dockerfile": "docker/acceptance/Dockerfile.e2e",
        "args": {
          "E2E_IMAGE": "${E2E_IMAGE:-mcr.microsoft.com/playwright:v1.56.1-noble}"
        }
      },
      "image": "silentstation-e2e:${SS_SNAPSHOT_ID}",
      "profiles": [
        "test"
      ],
      "environment": {
        "NODE_ENV": "production",
        "DATABASE_URL_FILE": "/run/secrets/database_url",
        "AUTH_SESSION_SECRET_FILE": "/run/secrets/auth_secret",
        "DB_TLS_MODE": "verify-full",
        "DB_TLS_CA_FILE": "/run/ca/ca.crt",
        "APP_URL": "https://localhost:18443",
        "AUTH_API_CORS_ORIGIN": "https://web:8443",
        "AUTH_REGISTER_OTP_EXPOSE_DEV_CODE": "false",
        "AUTH_ADMIN_LOGIN_OTP_EXPOSE_DEV_CODE": "false",
        "SURVEY_REAL_COLLECTION_ENABLED": "false",
        "SURVEY_ALLOW_SERVER_DEMO": "true",
        "AUTH_SMTP_HOST": "mailpit",
        "AUTH_SMTP_PORT": "1025",
        "AUTH_SMTP_SECURE": "false",
        "AUTH_SMTP_CA_FILE": "/run/ca/ca.crt",
        "AUTH_EMAIL_FROM": "test@acceptance.invalid",
        "GEMINI_API_KEY": "",
        "CRON_SECRET_FILE": "/run/secrets/cron_secret",
        "SS_SNAPSHOT_ID": "${SS_SNAPSHOT_ID}",
        "ACCEPTANCE_URL": "https://web:8443",
        "NODE_EXTRA_CA_CERTS": "/run/ca/ca.crt"
      },
      "volumes": [
        "ca:/run/ca:ro",
        "operator:/private-operator:ro",
        "evidence:/evidence",
        "runtime-secrets:/run/secrets:ro"
      ],
      "networks": [
        "isolated"
      ],
      "depends_on": {
        "web": {
          "condition": "service_started"
        },
        "secrets-init": {
          "condition": "service_completed_successfully"
        }
      },
      "mem_limit": "2g",
      "cpus": 2.0,
      "shm_size": "512m",
      "restart": "no"
    },
    "secrets-init": {
      "build": {
        "context": ".",
        "dockerfile": "docker/acceptance/Dockerfile.tls",
        "args": {
          "PG_IMAGE": "${PG_IMAGE:-postgres:16-alpine}"
        }
      },
      "image": "silentstation-tls:${SS_SNAPSHOT_ID}",
      "volumes": [
        "./.acceptance/private:/source:ro",
        "runtime-secrets:/runtime",
        "db-secret:/database"
      ],
      "network_mode": "none",
      "restart": "no",
      "entrypoint": [
        "sh",
        "/secrets-init.sh"
      ]
    }
  },
  "networks": {
    "isolated": {
      "internal": true
    }
  },
  "volumes": {
    "ca": {},
    "ca-private": {},
    "tls-db": {},
    "tls-web": {},
    "tls-smtp": {},
    "db-data": {},
    "operator": {},
    "evidence": {},
    "runtime-secrets": {},
    "db-secret": {}
  }
}
