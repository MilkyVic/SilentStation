pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
 include /etc/nginx/mime.types;
 access_log off;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 server {
  listen 8443 ssl;
  ssl_certificate /run/tls/server.crt;
  ssl_certificate_key /run/tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 256k;
  root /usr/share/nginx/html;
  location /api/internal/ { return 403; }
  location /api/ { proxy_pass http://api:3001; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto https; proxy_connect_timeout 5s; proxy_read_timeout 20s; }
  location /__test/mail/ { proxy_pass http://mailpit:8025; proxy_set_header Host $http_host; }
  location / { try_files $uri $uri/ /index.html; }
 }
}
